<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Avanthiga R K  Business Analytics Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>

<style>
:root{
  --bg:#0B0C0F;
  --card:#121418;
  --accent:#2D8CFF;
  --text:#E5E7EB;
  --muted:#9CA3AF;
  --radius:18px;
  --w:1200px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text)}
.wrap{max-width:var(--w);margin:auto;padding:40px}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}
.logo{font-weight:800;font-size:1.3rem}
nav a{margin-left:26px;color:var(--muted);font-weight:600;text-decoration:none;font-size:1rem}
nav a:hover{color:var(--text)}
.cta{background:var(--accent);padding:12px 24px;border-radius:999px;color:white;font-weight:700;text-decoration:none}

/* HERO */
.hero{display:grid;grid-template-columns:1fr 420px;gap:50px;align-items:center;margin-bottom:70px}
.hero h1{font-size:3.1rem;line-height:1.1;font-weight:800;margin-bottom:16px}
.hero p{color:var(--muted);font-size:1.2rem;line-height:1.5}
.badge{background:#1a1d22;color:var(--accent);padding:8px 14px;border-radius:10px;display:inline-block;font-weight:700;margin-bottom:20px}
.stats{display:flex;gap:24px;margin-top:26px}
.stat{background:var(--card);padding:16px 22px;border-radius:var(--radius);border:1px solid #1f242c;text-align:center;min-width:110px}
.stat strong{font-size:1.5rem;display:block}

.hero-side{background:var(--card);padding:26px;border-radius:var(--radius);border:1px solid #1f242c}
.hero-side h3{font-size:1.4rem;font-weight:700;margin-bottom:8px}
.hero-side p{color:var(--muted);margin-top:12px;line-height:1.5}

/* SECTIONS */
.section-title{font-size:1.9rem;font-weight:800;margin-bottom:26px;margin-top:20px}

/* PROJECT GRID */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:26px}
.card{background:var(--card);padding:30px;border-radius:var(--radius);border:1px solid #1f242c;grid-column:span 8;transition:.3s;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,0.5)}
.card.small{grid-column:span 4}
.card h3{margin-bottom:10px;font-size:1.45rem}
.card .meta{font-size:.95rem;color:var(--muted)}
.card p{margin-top:14px;color:var(--muted);line-height:1.55}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.tag{background:#1c2027;padding:8px 14px;border-radius:10px;font-size:.85rem;color:#d4d8df;font-weight:600}

/* CASE STUDIES */
.case-list{margin-top:50px;display:flex;flex-direction:column;gap:20px}
.case{background:var(--card);border:1px solid #1f242c;padding:22px;border-radius:var(--radius);transition:.3s}
.case:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,0.45)}
.case h4{font-size:1.35rem;margin-bottom:6px}
.case p{color:var(--muted)}

/* EXPERIENCE */
.exp{margin-top:60px}
.exp-row{display:flex;gap:24px;margin-bottom:30px}
.exp-left{min-width:160px;color:var(--muted);font-weight:600}
.exp-role{background:var(--card);padding:22px;border-radius:var(--radius);border:1px solid #1f242c}
.exp-role h3{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.exp-role ul{margin-top:10px;margin-left:20px;color:var(--muted);line-height:1.5}

/* FOOTER */
footer{text-align:center;color:var(--muted);margin-top:80px;padding:40px 0}

@media(max-width:950px){
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .card,.card.small{grid-column:span 12}
}
</style>
<!-- Enhanced with page transitions, glass navbar, and animations -->
<style>
/* Glass Navbar */
nav{
  position:sticky;
  top:0;
  backdrop-filter:blur(14px);
  background:rgba(11,12,15,0.55);
  border-bottom:1px solid rgba(255,255,255,0.05);
  padding:20px 0;
  z-index:999;
}

/* Page fade-in */
body{opacity:0;animation:fadeIn 0.8s ease forwards}
@keyframes fadeIn{to{opacity:1}}

/* Project carousel */
.carousel{
  margin-top:40px;
  overflow-x:auto;
  display:flex;
  gap:26px;
  padding-bottom:10px;
  scroll-snap-type:x mandatory;
}
.carousel-card{
  min-width:340px;
  background:var(--card);
  padding:24px;
  border-radius:var(--radius);
  border:1px solid #1f242c;
  scroll-snap-align:start;
  transition:0.4s;
}
.carousel-card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(0,0,0,0.45)}

/* Floating contact button */
.contact-float{
  position:fixed;
  bottom:28px;
  right:28px;
  background:var(--accent);
  padding:16px 22px;
  border-radius:999px;
  color:white;
  font-weight:700;
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
  cursor:pointer;
  transition:0.3s;
}
.contact-float:hover{transform:scale(1.05)}
</style>
<!-- Enhanced with more animations, parallax hero, glow cursor, and theme toggle -->
<style>
/* Smooth Scroll */
html{scroll-behavior:smooth}

/* Glow Cursor */
#cursor-glow{
  position:fixed;
  width:160px;
  height:160px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(45,140,255,0.25), transparent 70%);
  pointer-events:none;
  transform:translate(-50%, -50%);
  z-index:9999;
  mix-blend-mode:screen;
}

/* Theme Toggle */
.theme-toggle{
  position:fixed;
  top:26px;
  right:26px;
  background:#1e1f22;
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  color:var(--text);
  border:1px solid rgba(255,255,255,.08);
